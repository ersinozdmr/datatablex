name: Bug report
description: Report a bug to help us improve
labels: ["bug"]

body:
  - type: dropdown
    id: packages
    attributes:
      label: Package
      description: Which package is affected?
      multiple: true
      options:
        - "@datatablex/core"
        - "@datatablex/fastify"
        - "@datatablex/react"
        - "@datatablex/antd"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of the package are you using?
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the bug in detail
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce the bug or a link to a minimal repository
      placeholder: |
        1. Step one
        2. Step two
        3. Step three
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      description: Node version, browser, React and Ant Design versions, etc.
      placeholder: |
        - Node: 22.x
        - React: 18.x
        - Ant Design: 5.x
      render: text
