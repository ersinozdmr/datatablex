name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Only the latest push to a pull request runs; pushes to `main` always run to completion.
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository language
        run: pnpm check:language

      - name: Audit production dependencies
        # Development-only dependencies are outside this gate.
        run: pnpm audit --prod --audit-level moderate

      - name: Typecheck, lint, test, build
        run: pnpm turbo run typecheck lint test build
