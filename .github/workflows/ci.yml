name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:
  # The release workflow runs this whole workflow on the commit it is about to publish.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # Only the latest push to a pull request runs; pushes to `main` always run to completion.
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # The end-to-end tests of the example application need a real PostgreSQL. A service container is used
    # here; `apps/example/docker-compose.yml` is for local development only.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datatablex
          POSTGRES_PASSWORD: datatablex
          POSTGRES_DB: datatablex_example
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U datatablex -d datatablex_example"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The changeset check compares the pull request with its base branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository language
        run: pnpm check:language

      - name: Audit production dependencies
        # Development-only dependencies are outside this gate.
        run: pnpm audit --prod --audit-level moderate

      - name: Require a changeset for package changes
        # A pull request that changes a published package must carry a changeset, otherwise the change reaches
        # neither the changelog nor the version number. `pnpm changeset --empty` marks a change that needs no
        # release. The release pull request itself and dependency update pull requests are exempt.
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref != 'changeset-release/main' &&
          github.actor != 'dependabot[bot]'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

      - name: Typecheck, lint, test, build
        run: pnpm turbo run typecheck lint test build

      - name: Check bundle size budget
        run: pnpm size

      - name: Smoke-install packed tarballs in clean projects
        # Installs the four tarballs into clean projects: a consumer that uses only the hook builds without antd,
        # exceljs or pdfmake; the Ant Design components and the Excel adapter build with their own peers; core and
        # fastify load in Node as both ESM and CommonJS.
        run: pnpm smoke

      - name: Verify package exports and type resolution (publint + attw)
        # The `exports` map and the ESM and CJS type declarations are part of the published contract.
        run: |
          for dir in packages/*/; do
            (cd "$dir" && pnpm exec publint --strict && pnpm exec attw --pack . --profile node16)
          done

      - name: Verify @datatablex/core has zero runtime dependencies
        run: |
          deps=$(node -p "JSON.stringify(require('./packages/core/package.json').dependencies || {})")
          if [ "$deps" != "{}" ]; then
            echo "::error::@datatablex/core must not declare runtime dependencies, found: $deps"
            exit 1
          fi

      - name: Verify published tarballs include README and LICENSE
        # A consumer reads the usage contract and the license from inside the installed package.
        run: |
          for dir in packages/*/; do
            (cd "$dir" && npm pack --dry-run --json) > /tmp/pack.json
            missing=$(node -e "
              const files = JSON.parse(require('fs').readFileSync('/tmp/pack.json', 'utf8'))[0].files.map((f) => f.path);
              console.log(['README.md', 'LICENSE'].filter((f) => !files.includes(f)).join(', '));
            ")
            if [ -n "$missing" ]; then
              echo "::error::${dir} tarball is missing: $missing"
              exit 1
            fi
          done

      # Firefox and WebKit run only the scenarios tagged `@cross-browser` (native download and export cancel);
      # see `apps/example/playwright.config.ts`.
      - name: Install Playwright browsers
        run: pnpm --filter example exec playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end tests
        run: pnpm --filter example test:e2e
        env:
          # Matches the port mapping of the `postgres` service above and `apps/example/.env.example`.
          DATABASE_URL: postgres://datatablex:datatablex@localhost:55432/datatablex_example
