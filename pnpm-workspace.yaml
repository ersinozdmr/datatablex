packages:
  - "packages/*"
  - "apps/*"

# Dependencies whose install scripts may run (pnpm runs none by default). esbuild's script checks
# that the binary for this platform is in place.
allowBuilds:
  esbuild: true

overrides:
  "exceljs>uuid": "^11.1.1"
  "tsup>esbuild": "^0.28.2"
  "brace-expansion@<1.1.21": "^1.1.21"
  "brace-expansion@>=4.0.0 <5.0.12": "^5.0.12"
